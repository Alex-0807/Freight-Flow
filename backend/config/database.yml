# PostgreSQL.
#
# Locally (Homebrew PostgreSQL) the DB_* variables are unset: Rails connects over the
# Unix socket as your OS user. In Docker (Step 11) docker-compose sets DB_HOST=db etc.
#
# We deliberately use DB_* variables rather than DATABASE_URL for dev/test:
# DATABASE_URL overrides the database name for *every* environment it is visible in,
# so running specs in a shell with DATABASE_URL set would hit the development database.
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV["DB_HOST"] %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>
  # Must be >= Puma threads (web) and >= Sidekiq concurrency (worker), otherwise
  # threads wait for a connection and eventually raise ConnectionTimeoutError.
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: freightflow_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: freightflow_test

# In production, provide DATABASE_URL; Rails merges it over these values.
production:
  <<: *default
  database: freightflow_production
